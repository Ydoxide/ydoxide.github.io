<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
<script>
  const scene = new THREE.Scene();

  // ⭐ Renderer optimisé Flutter Web
  const renderer = new THREE.WebGLRenderer({
    alpha: true,
    antialias: true
  });
  renderer.setPixelRatio(1);
  document.body.appendChild(renderer.domElement);

  // ⭐ Camera
  const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 1000);
  camera.position.set(0, 0, 10);

  // ⭐ OrbitControls
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableZoom = false;
  controls.enablePan = false;
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.rotateSpeed = 0.8;

  // ⭐ Lumières
  const light = new THREE.DirectionalLight(0xffffff, 1.2);
  light.position.set(5, 5, 5);
  scene.add(light);
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));

  const loader = new THREE.GLTFLoader();

  let planet;
  const pickable = []; // ⭐ objets raycastables

  loader.load('jupiter.glb', function (gltf) {

    planet = gltf.scene;

    // ⭐ Ajout des meshes internes dans pickable
    planet.traverse(obj => {
      if (obj.isMesh) pickable.push(obj);
    });

    // ⭐ Centrage automatique
    const box = new THREE.Box3().setFromObject(planet);
    const center = box.getCenter(new THREE.Vector3());
    planet.position.sub(center);

    planet.scale.set(5.8, 5.8, 5.8);

    scene.add(planet);

    animate();
  });

  // ⭐ Raycaster hover + click
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  let isHovering = false;

  function updateMouse(event) {
    const rect = renderer.domElement.getBoundingClientRect();
    mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
  }

  window.addEventListener("mousemove", (event) => {
    updateMouse(event);
    raycaster.setFromCamera(mouse, camera);

    const hit = raycaster.intersectObjects(pickable, true);

    if (hit.length > 0) {
      if (!isHovering) {
        isHovering = true;
        window.parent.postMessage({ type: "planet_hover", planet: "Jupiter" }, "*");
      }
    } else {
      if (isHovering) {
        isHovering = false;
        window.parent.postMessage({ type: "planet_hover_end", planet: "Jupiter" }, "*");
      }
    }
  });

  window.addEventListener("click", (event) => {
    updateMouse(event);
    raycaster.setFromCamera(mouse, camera);

    const hit = raycaster.intersectObjects(pickable, true);

    if (hit.length > 0) {
      window.parent.postMessage({ type: "planet_click", planet: "Jupiter" }, "*");
    }
  });

  // ⭐ Resize spécial Flutter
  function resizeRenderer() {
    const parent = renderer.domElement.parentElement;
    const width = parent.clientWidth;
    const height = parent.clientHeight;

    if (width > 0 && height > 0) {
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    }
  }

  function animate() {
    requestAnimationFrame(animate);

    resizeRenderer();

    if (planet) planet.rotation.y += 0.006;

    controls.update();
    renderer.render(scene, camera);
  }

  window.addEventListener('resize', resizeRenderer);
  resizeRenderer();
</script>

</body>
</html>
