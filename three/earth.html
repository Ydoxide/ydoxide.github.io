<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
<script>
  const scene = new THREE.Scene();

  const renderer = new THREE.WebGLRenderer({
    alpha: true,
    antialias: true
  });

  // ⭐ IMPORTANT POUR FLUTTER WEB
  renderer.setPixelRatio(1);
  document.body.appendChild(renderer.domElement);

  const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 1000);
  camera.position.set(0, 0, 7);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableZoom = false;
  controls.enablePan = false;
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.rotateSpeed = 0.8;

  const light = new THREE.DirectionalLight(0xffffff, 1);
  light.position.set(5, 5, 5);
  scene.add(light);

  scene.add(new THREE.AmbientLight(0xffffff, 0.6));

  const loader = new THREE.GLTFLoader();

  let earth, moon, moonPivot;
  const pickable = []; // ⭐ objets raycastables

  loader.load('earth.glb', function (gltf) {
    earth = gltf.scene;

    // Ajout des meshes internes dans pickable
    earth.traverse(obj => {
      if (obj.isMesh) pickable.push(obj);
    });

    const box = new THREE.Box3().setFromObject(earth);
    const center = box.getCenter(new THREE.Vector3());
    earth.position.sub(center);

    earth.scale.set(1, 1, 1);
    scene.add(earth);

    loader.load('moon.glb', function (gltf2) {
      moon = gltf2.scene;
      moon.scale.set(0.4, 0.4, 0.4);

      // Ajout des meshes de la lune dans pickable
      moon.traverse(obj => {
        if (obj.isMesh) pickable.push(obj);
      });

      moonPivot = new THREE.Object3D();
      scene.add(moonPivot);

      moon.position.set(2, 0, 0);
      moonPivot.add(moon);

      animate();
    });
  });

  // ⭐ RAYCASTER POUR HOVER + CLICK
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  let isHovering = false;

  function updateMouse(event) {
    const rect = renderer.domElement.getBoundingClientRect();
    mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
  }

  window.addEventListener("mousemove", (event) => {
    updateMouse(event);
    raycaster.setFromCamera(mouse, camera);

    const hit = raycaster.intersectObjects(pickable, true);

    if (hit.length > 0) {
      if (!isHovering) {
        isHovering = true;
        window.parent.postMessage({ type: "planet_hover", planet: "Terre" }, "*");
      }
    } else {
      if (isHovering) {
        isHovering = false;
        window.parent.postMessage({ type: "planet_hover_end", planet: "Terre" }, "*");
      }
    }
  });

  window.addEventListener("click", (event) => {
    updateMouse(event);
    raycaster.setFromCamera(mouse, camera);

    const hit = raycaster.intersectObjects(pickable, true);

    if (hit.length > 0) {
      window.parent.postMessage({ type: "planet_click", planet: "Terre" }, "*");
    }
  });

  // ⭐ Resize spécial Flutter
  function resizeRenderer() {
    const parent = renderer.domElement.parentElement;
    const width = parent.clientWidth;
    const height = parent.clientHeight;

    if (width > 0 && height > 0) {
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    }
  }

  function animate() {
    requestAnimationFrame(animate);

    resizeRenderer();

    if (earth) earth.rotation.y += 0.003;
    if (moonPivot) moonPivot.rotation.y += 0.01;

    controls.update();
    renderer.render(scene, camera);
  }

  window.addEventListener('resize', resizeRenderer);
  resizeRenderer();
</script>

</body>
</html>
